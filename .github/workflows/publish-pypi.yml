name: Publish to PyPI

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  inspect:
    name: Verify completed release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: artifacts-plan-dist-manifest
          path: release-plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Require a stable hosted release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_REPO: ${{ github.repository }}
        run: |
          host_conclusion="$(
            gh api "repos/${GH_REPO}/actions/runs/${RELEASE_RUN_ID}/jobs" \
              --paginate \
              --jq '.jobs[] | select(.name == "host") | .conclusion' \
              | head -n 1
          )"
          prerelease="$(jq -r '.announcement_is_prerelease' release-plan/plan-dist-manifest.json)"
          if [[ "$host_conclusion" == "success" && "$prerelease" == "false" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Upload wheels and sdist
    needs: inspect
    if: needs.inspect.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    environment:
      name: release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uvx --from twine twine check wheels/*
      - name: Publish with PyPI trusted publishing
        run: uv publish --trusted-publishing always --verbose wheels/*
