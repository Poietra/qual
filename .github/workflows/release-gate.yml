name: Release gate

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Validate release metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$RELEASE_TAG" == "dry-run" ]]; then
            python3 scripts/check_release.py
          else
            python3 scripts/check_release.py --tag "$RELEASE_TAG"
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo publish --locked --dry-run
      - name: Fetch pinned Manim source
        run: |
          git init "${RUNNER_TEMP}/manim"
          git -C "${RUNNER_TEMP}/manim" remote add origin https://github.com/ManimCommunity/manim.git
          git -C "${RUNNER_TEMP}/manim" fetch --depth 1 origin 4d25c031ffe71c602e20935afd54a96f33545a6e
          git -C "${RUNNER_TEMP}/manim" checkout --detach FETCH_HEAD
      - name: Upstream knowledge drift gate
        env:
          QUAL_MANIM_ROOT: ${{ runner.temp }}/manim
        run: cargo test --test knowledge_drift -- --ignored upstream_profile_matches_clean_base_commit
