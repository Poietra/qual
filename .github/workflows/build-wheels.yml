name: Build PyPI wheels

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - LICENSE
      - LICENSES/**
      - RELINKING.md
      - THIRD-PARTY-LICENSES.md
      - pyproject.toml
      - .github/workflows/build-wheels.yml

permissions:
  contents: read

env:
  MATURIN_VERSION: v1.11.5

jobs:
  linux:
    name: Linux wheel (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
          - target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
          - target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Build wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          command: build
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out wheels
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: wheels/*.whl
          if-no-files-found: error

  macos:
    name: macOS wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          command: build
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --out wheels
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: wheels/*.whl
          if-no-files-found: error

  windows:
    name: Windows wheel (x86_64-pc-windows-msvc)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          command: build
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: x86_64-pc-windows-msvc
          args: --release --locked --compatibility pypi --out wheels
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-x86_64-pc-windows-msvc
          path: wheels/*.whl
          if-no-files-found: error

  sdist:
    name: Python source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uvx --from maturin==1.11.5 maturin sdist --out wheels
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: wheels/*.tar.gz
          if-no-files-found: error

  verify:
    name: Verify installed wheel
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-x86_64-unknown-linux-gnu
          path: wheels
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install wheels/*.whl
      - run: manim-lint --version
      - name: Verify license material in the wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("wheels").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          for required in (
              "LICENSES/GPL-3.0-only.txt",
              "LICENSES/LGPL-3.0-only.txt",
              "RELINKING.md",
              "THIRD-PARTY-LICENSES.md",
          ):
              assert any(name.endswith(required) for name in names), required
          PY
