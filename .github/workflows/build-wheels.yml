name: Build PyPI wheels

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - LICENSE
      - LICENSES/**
      - RELINKING.md
      - THIRD-PARTY-LICENSES.md
      - pyproject.toml
      - .github/workflows/build-wheels.yml

permissions:
  contents: read

env:
  MATURIN_VERSION: v1.11.5

jobs:
  linux:
    name: Linux wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out wheels
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wheels-${{ matrix.target }}
          path: wheels/*.whl
          if-no-files-found: error

  macos:
    name: macOS wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --out wheels
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wheels-${{ matrix.target }}
          path: wheels/*.whl
          if-no-files-found: error

  windows:
    name: Windows wheel (x86_64-pc-windows-msvc)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: x86_64-pc-windows-msvc
          args: --release --locked --compatibility pypi --out wheels
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wheels-x86_64-pc-windows-msvc
          path: wheels/*.whl
          if-no-files-found: error

  sdist:
    name: Python source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uvx --from maturin==1.11.5 maturin sdist --out wheels
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wheels-sdist
          path: wheels/*.tar.gz
          if-no-files-found: error

  verify:
    name: Verify installed wheel
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-x86_64-unknown-linux-gnu
          path: wheels
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install wheels/*.whl
      - run: qual --version
      - name: Verify license material in the wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("wheels").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          for required in (
              "LICENSES/GPL-3.0-only.txt",
              "LICENSES/LGPL-3.0-only.txt",
              "RELINKING.md",
              "THIRD-PARTY-LICENSES.md",
          ):
              assert any(name.endswith(required) for name in names), required
          PY
