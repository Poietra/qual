[build-system]
requires = ["maturin>=1.11.5,<2.0"]
build-backend = "maturin"

[project]
name = "qual-manim"
dynamic = ["version"]
description = "A Manim-aware linter for render-time errors, visual bugs, and per-frame performance traps"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = [
  "LICENSE",
  "LICENSES/GPL-3.0-only.txt",
  "LICENSES/LGPL-3.0-only.txt",
  "RELINKING.md",
  "THIRD-PARTY-LICENSES.md",
]
keywords = ["manim", "linter", "static-analysis", "animation", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://poietra.github.io/qual/"
Documentation = "https://poietra.github.io/qual/"
Repository = "https://github.com/Poietra/qual"
Changelog = "https://github.com/Poietra/qual/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
strip = true
