[package]
name = "qual"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "A Manim-aware linter for render-time errors, visual bugs, and per-frame performance traps"
license = "MIT"
publish = ["crates-io"]
repository = "https://github.com/Poietra/qual"
homepage = "https://poietra.github.io/qual/"
documentation = "https://poietra.github.io/qual/"
readme = "README.md"
keywords = ["manim", "linter", "static-analysis", "animation", "python"]
categories = ["development-tools", "command-line-utilities"]
# The test suite depends on fixture corpora that would triple the package
# size; run it from a repository checkout, not from the published crate.
exclude = ["/tests", "/benchmarks", "/.github", "/.claude"]
default-run = "qual"

[[bin]]
name = "qual"
path = "src/main.rs"

[[bin]]
name = "sync_manim_knowledge"
path = "src/bin/sync_manim_knowledge.rs"
required-features = ["dev-tools"]

[features]
default = []
# Maintainer-only binaries are excluded from normal cargo install, wheels,
# release archives, and standalone installers.
dev-tools = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
globset = "0.4"
# A linter allocates heavily across many threads; the system allocator
# both costs ~10% wall time here and makes the run far less consistent.
mimalloc = { version = "0.1", default-features = false }
pathdiff = "0.2"
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
rustpython-parser = { version = "0.4", features = ["full-lexer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
jsonschema = { version = "0.42.2", default-features = false }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Full debug info costs ~12 GB of `target/debug/deps` across 180 dependencies
# and 30 test binaries. Line tables keep backtraces and panic locations
# useful, which is all the test suite and `cargo run` need here.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# cargo-dist uses this profile for standalone release archives.
[profile.dist]
inherits = "release"
lto = "thin"
