[package]
name = "manim-lint"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Static lifecycle and performance analysis for Manim scenes"
license = "MIT"
repository = "https://github.com/example/manim-lint"

[[bin]]
name = "manim-lint"
path = "src/main.rs"

[[bin]]
name = "sync_manim_knowledge"
path = "src/bin/sync_manim_knowledge.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
globset = "0.4"
pathdiff = "0.2"
rustpython-parser = { version = "0.4", features = ["full-lexer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

